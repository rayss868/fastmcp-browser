name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build extension
        run: node build.mjs
        working-directory: extension
        env:
          VERSION: ${{ github.ref_name }}
      - name: Package archives
        run: |
          cd extension/dist
          zip -r fastmcp-browser-extension-chromium.zip chromium
          zip -r fastmcp-browser-extension-firefox.zip firefox
          (cd firefox && zip -r ../fastmcp-browser-extension-firefox.xpi .)
          python -c "import zipfile; z = zipfile.ZipFile('fastmcp-browser-extension-firefox.xpi'); assert z.testzip() is None and 'manifest.json' in z.namelist()"
      - name: Create GitHub Release with extension archives
        uses: softprops/action-gh-release@v2
        with:
          body: |
            WebExtension builds of FastMCP Browser — the MCP bridge that drives Chrome/Firefox over a loopback WebSocket (34 MCP browser tools).

            ### What's new in v0.7.1

            - **Browser tool inputs are now flexible.** The server accepts numeric parameters (`tabId`, `revision`, `milliseconds`, `timeoutMs`, `stableMs`, `limit`, `steps`, `clickCount`, pointer `x`/`y`, and more) as strings or numbers, so a client that serializes numbers as JSON strings no longer fails validation with `data/tabId must be integer`. All tool schemas are passthrough — unknown keys are not rejected at the client — while the server still validates deliberately.
            - **Playwright-style selectors are rewritten to CSS.** A locator like `button:button:nth-of-type(1)` is normalized to `button:nth-of-type(1)`; genuine CSS pseudo-classes (`:hover`, `:first-child`) and `text=`/`xpath=`/`host >>> inner` prefixes are untouched.
            - **`browser_act` forgives a `querySelector(...).click()` expression.** An `expression` passed to `browser_act` by mistake is rewritten into a selector-based click; any other expression gets a clear error pointing at `browser_evaluate` instead of a confusing schema failure.

            ### Install

            Unzip an archive and load it unpacked:
            - **Chromium** (`fastmcp-browser-extension-chromium.zip`) → `chrome://extensions` → Load unpacked → the `chromium` folder
            - **Firefox** (`fastmcp-browser-extension-firefox.zip`) → `about:debugging` → Load Temporary Add-on → `firefox/manifest.json`

            The Firefox `.xpi` has `manifest.json` at the archive root. It is unsigned; standard Firefox release builds require a Mozilla-signed add-on for permanent installation. LibreWolf and Firefox Developer Edition/Nightly may allow unsigned add-ons when signature enforcement is disabled.
          files: |
            extension/dist/fastmcp-browser-extension-chromium.zip
            extension/dist/fastmcp-browser-extension-firefox.zip
            extension/dist/fastmcp-browser-extension-firefox.xpi
