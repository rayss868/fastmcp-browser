name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build extension
        run: node build.mjs
        working-directory: extension
        env:
          VERSION: ${{ github.ref_name }}
      - name: Package archives
        run: |
          cd extension/dist
          zip -r fastmcp-browser-extension-chromium.zip chromium
          zip -r fastmcp-browser-extension-firefox.zip firefox
          (cd firefox && zip -r ../fastmcp-browser-extension-firefox.xpi .)
          python -c "import zipfile; z = zipfile.ZipFile('fastmcp-browser-extension-firefox.xpi'); assert z.testzip() is None and 'manifest.json' in z.namelist()"
      - name: Create GitHub Release with extension archives
        uses: softprops/action-gh-release@v2
        with:
          body: |
            WebExtension builds of FastMCP Browser — the MCP bridge that drives Chrome/Firefox over a loopback WebSocket (33 MCP browser tools).

            ### What's new in v0.4.4

            - **Actionable diffs.** After every action the engine returns a diff of what actually changed on the page, so agents can verify their click or typing landed instead of re-snapshotting blindly.
            - **Auto post-action snapshot.** Actions now ship a refreshed snapshot (with new refs) in the same call — no extra `browser_snapshot` round-trip needed.
            - **Goal ranking.** `browser_snapshot` / `browser_inventory` accept a `goal` (and `relevantOnly`) so candidates are ranked by relevance and `limit` cuts from the most relevant end instead of DOM order — long pages no longer hide the target form at the bottom.
            - **`browser_find` tool.** Text or regex lookup that returns only the matching elements with refs, without the full tree. 33 MCP tools now.
            - **Ref recovery fixes.** Radio fill on Google Forms, null unwrap in `browser_evaluate`, and ref recovery by duplicate index.
            - **Housekeeping** — MCP server version bumped to 0.4.4; README extension test count corrected (144).

            ### Install

            Unzip an archive and load it unpacked:
            - **Chromium** (`fastmcp-browser-extension-chromium.zip`) → `chrome://extensions` → Load unpacked → the `chromium` folder
            - **Firefox** (`fastmcp-browser-extension-firefox.zip`) → `about:debugging` → Load Temporary Add-on → `firefox/manifest.json`

            The Firefox `.xpi` has `manifest.json` at the archive root. It is unsigned; standard Firefox release builds require a Mozilla-signed add-on for permanent installation. LibreWolf and Firefox Developer Edition/Nightly may allow unsigned add-ons when signature enforcement is disabled.
          files: |
            extension/dist/fastmcp-browser-extension-chromium.zip
            extension/dist/fastmcp-browser-extension-firefox.zip
            extension/dist/fastmcp-browser-extension-firefox.xpi
