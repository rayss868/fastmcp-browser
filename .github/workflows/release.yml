name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build extension
        run: node build.mjs
        working-directory: extension
        env:
          VERSION: ${{ github.ref_name }}
      - name: Package archives
        run: |
          cd extension/dist
          zip -r fastmcp-browser-extension-chromium.zip chromium
          zip -r fastmcp-browser-extension-firefox.zip firefox
          (cd firefox && zip -r ../fastmcp-browser-extension-firefox.xpi .)
          python -c "import zipfile; z = zipfile.ZipFile('fastmcp-browser-extension-firefox.xpi'); assert z.testzip() is None and 'manifest.json' in z.namelist()"
      - name: Create GitHub Release with extension archives
        uses: softprops/action-gh-release@v2
        with:
          body: |
            WebExtension builds of FastMCP Browser — the MCP bridge that drives Chrome/Firefox over a loopback WebSocket (32 MCP browser tools).

            ### What's new in v0.4.1

            - **Security fix: browser tools are now sandboxed to the "Automation" tab group.** `browser_tabs` only ever lists tabs inside the session group and authorizes exactly that set; any tool that used to enumerate or target tabs outside the group no longer can. A tab dragged out of the group immediately loses authorization (the authorized set is replaced, not accumulated), so the bridge can no longer read, click, or type on tabs the session does not own.
            - **The identity hint is group-scoped too.** The `activeTab` hint reported by `browser_instances` is now derived from group tabs only; if the group has no active tab, the hint is omitted. No tab outside the group is exposed through the bridge anymore.
            - **Housekeeping** — removed the now-redundant `browser_tabs` reconcile in the session attach path (authorization is derived once from the group); added regression tests for group-only listing, hint sandboxing, and authorization replacement.

            ### Install

            Unzip an archive and load it unpacked:
            - **Chromium** (`fastmcp-browser-extension-chromium.zip`) → `chrome://extensions` → Load unpacked → the `chromium` folder
            - **Firefox** (`fastmcp-browser-extension-firefox.zip`) → `about:debugging` → Load Temporary Add-on → `firefox/manifest.json`

            The Firefox `.xpi` has `manifest.json` at the archive root. It is unsigned; standard Firefox release builds require a Mozilla-signed add-on for permanent installation. LibreWolf and Firefox Developer Edition/Nightly may allow unsigned add-ons when signature enforcement is disabled.
          files: |
            extension/dist/fastmcp-browser-extension-chromium.zip
            extension/dist/fastmcp-browser-extension-firefox.zip
            extension/dist/fastmcp-browser-extension-firefox.xpi
